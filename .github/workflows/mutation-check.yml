#
# Reusable: the mutation check of a test suite, which injects every defect of its reference implementation and checks
# that a test of the requirement items the defect violates fails. Many suite runs, so callers schedule it:
#
#   on:
#     workflow_dispatch:
#     schedule:
#       - cron: "17 4 * * 1"
#   jobs:
#     mutation:
#       uses: Guiliano99/keyutils-py/.github/workflows/mutation-check.yml@<ref>
#       with:
#         command: make mutation-check
#       secrets:
#         PKIXUTILS_DEPLOY_KEY: ${{ secrets.PKIXUTILS_DEPLOY_KEY }}
#         PKIXCA_DEPLOY_KEY: ${{ secrets.PKIXCA_DEPLOY_KEY }}  # only a caller that depends on pkixca
name: Mutation check (reusable)

on:
  workflow_call:
    inputs:
      python-version:
        type: string
        default: "3.13"
      runner:
        type: string
        default: ubuntu-24.04
      install-command:
        type: string
        default: uv sync --frozen
      command:
        type: string
        default: make mutation-check
      report:
        description: "The matrix to upload"
        type: string
        default: reports/mutation_matrix.md
    secrets:
      PKIXUTILS_DEPLOY_KEY:
        required: false
      PKIXCA_DEPLOY_KEY:
        required: false

jobs:
  mutation_check:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}
      - name: Let git read the private repositories
        env:
          PKIXUTILS_DEPLOY_KEY: ${{ secrets.PKIXUTILS_DEPLOY_KEY }}
          PKIXCA_DEPLOY_KEY: ${{ secrets.PKIXCA_DEPLOY_KEY }}
        run: |
          umask 077
          # GitHub takes the repository from the key, so each repository gets an ssh host of its own with its own key.
          read_with_key() {
            if [ -z "$2" ]; then echo "No deploy key given; $1 is read over HTTPS."; return; fi
            install -m 700 -d ~/.ssh
            printf '%s\n' "$2" > ~/.ssh/"deploy-$1"
            printf 'Host github-%s\n  HostName github.com\n  IdentityFile %s\n  IdentitiesOnly yes\n' \
              "$1" "$HOME/.ssh/deploy-$1" >> ~/.ssh/config
            ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts
            git config --global url."git@github-$1:Guiliano99/$1.git".insteadOf "https://github.com/Guiliano99/$1.git"
          }
          read_with_key pkixutils-py "$PKIXUTILS_DEPLOY_KEY"
          read_with_key pkixca-py "$PKIXCA_DEPLOY_KEY"
      - name: Install the dependencies
        run: |
          pip install --upgrade uv
          ${{ inputs.install-command }}
      - name: Inject every defect
        run: ${{ inputs.command }}
      - name: Upload the matrix
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-matrix
          path: ${{ inputs.report }}
