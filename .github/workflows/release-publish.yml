#
# Reusable: publish the release of a pushed tag vX.Y.Z with the notes of the `# X.Y.Z` section of CHANGELOG.md, on
# GitHub and, when `gitlab-project-id` is given, on GitLab as well. The caller grants `contents: write`:
#
#   on:
#     push:
#       tags: ["v*.*.*"]
#   permissions:
#     contents: write
#   jobs:
#     publish:
#       uses: Guiliano99/keyutils-py/.github/workflows/release-publish.yml@<ref>
#       with:
#         devtools-ref: <ref>
#         gitlab-project-id: ${{ vars.GITLAB_PROJECT_ID }}
#         gitlab-api-url: ${{ vars.GITLAB_API_URL }}
#       secrets:
#         GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
name: Release publish (reusable)

on:
  workflow_call:
    inputs:
      devtools-ref:
        description: "The ref of keyutils-py to install pkix-devtools from, the one in `uses:`"
        type: string
        required: true
      gitlab-project-id:
        description: "Publish on GitLab too; empty publishes on GitHub only"
        type: string
        default: ""
      gitlab-api-url:
        type: string
        default: ""
    secrets:
      GITLAB_TOKEN:
        required: false

jobs:
  prepare_release_data:
    name: Prepare release metadata
    runs-on: ubuntu-24.04
    outputs:
      tag_name: ${{ steps.validation.outputs.tag_name }}
      tag_version: ${{ steps.validation.outputs.tag_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install pkix-devtools
        run: |
          python -m pip install --quiet \
            "pkix-devtools @ git+https://github.com/Guiliano99/keyutils-py.git@${{ inputs.devtools-ref }}#subdirectory=pkix-devtools"
      - name: Validate tag matches pyproject.toml version
        id: validation
        run: release-metadata validate-tag
      - name: Create release notes from CHANGELOG.md
        run: |
          release-metadata write-release-notes \
            --version "${{ steps.validation.outputs.tag_version }}" --output RELEASE_NOTES.md
      - name: Upload release notes artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: RELEASE_NOTES.md

  publish_github:
    name: Publish GitHub release
    runs-on: ubuntu-24.04
    needs: prepare_release_data
    steps:
      - name: Download release notes artifact
        uses: actions/download-artifact@v8
        with:
          name: release-notes
      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare_release_data.outputs.tag_name }}
          name: Release ${{ needs.prepare_release_data.outputs.tag_name }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false

  publish_gitlab:
    name: Publish GitLab release
    if: inputs.gitlab-project-id != ''
    runs-on: ubuntu-24.04
    needs: prepare_release_data
    steps:
      - name: Download release notes artifact
        uses: actions/download-artifact@v8
        with:
          name: release-notes
      - name: Create GitLab release
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_PROJECT_ID: ${{ inputs.gitlab-project-id }}
          GITLAB_API_URL: ${{ inputs.gitlab-api-url }}
          TAG_NAME: ${{ needs.prepare_release_data.outputs.tag_name }}
        run: |
          if [ -z "$GITLAB_TOKEN" ]; then
            echo "gitlab-project-id is set, but the secret GITLAB_TOKEN is missing."
            exit 1
          fi
          API_URL="${GITLAB_API_URL:-https://gitlab.com/api/v4}"
          DESCRIPTION=$(python -c 'import json, pathlib; print(json.dumps(pathlib.Path("RELEASE_NOTES.md").read_text(encoding="utf-8")))')
          PAYLOAD=$(printf '{"name": "Release %s", "tag_name": "%s", "description": %s, "ref": "%s"}' \
            "$TAG_NAME" "$TAG_NAME" "$DESCRIPTION" "$TAG_NAME")
          # PUT first (an idempotent update), then POST if the release does not exist yet.
          HTTP_CODE=$(curl -sS -o "$RUNNER_TEMP/gitlab-release.json" -w "%{http_code}" --request PUT \
            --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" --header "Content-Type: application/json" \
            --data "${PAYLOAD}" "${API_URL}/projects/${GITLAB_PROJECT_ID}/releases/${TAG_NAME}")
          if [ "$HTTP_CODE" = "404" ]; then
            HTTP_CODE=$(curl -sS -o "$RUNNER_TEMP/gitlab-release.json" -w "%{http_code}" --request POST \
              --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" --header "Content-Type: application/json" \
              --data "${PAYLOAD}" "${API_URL}/projects/${GITLAB_PROJECT_ID}/releases")
          fi
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "GitLab release API call failed with HTTP status: $HTTP_CODE"
            cat "$RUNNER_TEMP/gitlab-release.json"
            exit 1
          fi
          echo "GitLab release published for ${TAG_NAME}."
